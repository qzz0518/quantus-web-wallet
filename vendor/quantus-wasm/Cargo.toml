[package]
name = "quantus-wasm"
version = "0.2.0"
edition = "2021"
description = "WASM bindings for Quantus account derivation and ML-DSA-65 / ML-DSA-87 extrinsic signing"
license = "MIT"
repository = "https://github.com/Quantus-Network/quantus-wasm"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Chain crypto, pinned to the exact versions the Quantus runtime uses so that
# addresses (Poseidon) and signatures (ML-DSA-65 / ML-DSA-87) are byte-identical.
qp-poseidon-core = { version = "=3.1.0", default-features = false }
qp-rusty-crystals-dilithium = { version = "=4.1.1", default-features = false, features = ["ml-dsa-65", "ml-dsa-87"] }
qp-rusty-crystals-hdwallet = { version = "=4.1.1", features = ["ml-dsa-65"], optional = true }
zeroize = { version = "1.8", default-features = false, features = ["alloc"] }

# SCALE codec + AccountId32/SS58 (sp-core does not pull sp-io/sp-runtime, so it
# stays wasm-friendly).
parity-scale-codec = { version = "3.7", default-features = false, features = ["derive"] }
sp-core = { version = "39.0.0", default-features = false, features = ["serde"] }

# WASM glue
wasm-bindgen = "0.2"
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde-wasm-bindgen = "0.6"
hex = { version = "0.4", default-features = false, features = ["alloc"] }

# Wormhole exit prover (feature `wormhole-prover`, separate artifact): the
# official circuit/prover/aggregator crates pinned by the mainnet runtime
# (chain commit f5828f0, `qp-wormhole-* = 4.3.0`, `qp-plonky2 = 1.5.5`).
# The aggregator's `multithread` (rayon) feature stays off: the browser
# artifact is single-threaded.
qp-wormhole-prover = { version = "=4.3.0", optional = true }
qp-wormhole-aggregator = { version = "=4.3.0", default-features = false, features = ["std"], optional = true }
qp-wormhole-circuit = { version = "=4.3.0", optional = true }
qp-wormhole-inputs = { version = "=4.3.0", optional = true }
qp-wormhole-verifier = { version = "=4.3.0", optional = true }
qp-zk-circuits-common = { version = "=4.3.0", optional = true }
qp-plonky2 = { version = "=1.5.5", default-features = false, features = ["std", "rand"], optional = true }
qp-plonky2-verifier = { version = "=1.5.5", optional = true }
js-sys = { version = "0.3", optional = true }
serde_json = { version = "1", default-features = false, features = ["alloc"], optional = true }

# Browser/Node RNG backend so transitive getrandom users link on wasm32.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
# The zk row blinding of the private-batch circuit draws from `rand` 0.10
# (`getrandom` 0.4), which needs its browser backend selected explicitly.
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"], optional = true }

[features]
default = ["mnemonic"]
# BIP39 mnemonic -> account/signing helpers (Quantus HD path).
mnemonic = ["dep:qp-rusty-crystals-hdwallet"]
# In-browser Wormhole exit prover; built into `browser-prover/` by
# scripts/build-prover.sh, never into the main signing artifact.
wormhole-prover = [
  "mnemonic",
  "dep:qp-wormhole-prover",
  "dep:qp-wormhole-aggregator",
  "dep:qp-wormhole-circuit",
  "dep:qp-wormhole-inputs",
  "dep:qp-wormhole-verifier",
  "dep:qp-zk-circuits-common",
  "dep:qp-plonky2",
  "dep:qp-plonky2-verifier",
  "dep:js-sys",
  "dep:serde_json",
  "dep:getrandom04",
]

# Canonical references used ONLY in tests to prove the lightweight SCALE
# encoding matches the runtime byte-for-byte. Not shipped in the wasm.
[dev-dependencies]
sp-runtime = "45.0.0"
qp-dilithium-crypto = { version = "=0.7.0", features = ["std"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

# The prover artifact trades size for proving speed.
[profile.prover]
inherits = "release"
opt-level = 3

# The prover tests run the real circuits; unoptimized plonky2 would take hours.
[profile.test]
opt-level = 3
